name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = just build the selected ref)"
        type: choice
        options: [ none, patch, minor, major ]
        default: none

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Version bumps must be run from main (got ${GITHUB_REF})"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' config/initializers/version.rb)
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="${major}.${minor}.${patch}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${new}" > /dev/null; then
            echo "::error::Tag v${new} already exists"
            exit 1
          fi
          echo "Bumping ${current} -> ${new}"
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"

      - name: Update version and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/VERSION = \".*\"/VERSION = \"${VERSION}\"/" config/initializers/version.rb
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [${VERSION}] - $(date -u +%F)/" CHANGELOG.md
          git diff

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${VERSION}."
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push --atomic origin HEAD:main "${TAG}"

  build:
    needs: bump
    if: ${{ !cancelled() && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.bump.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.bump.outputs.tag }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || needs.bump.outputs.tag != '' }}
            type=ref,event=branch,enable=${{ needs.bump.outputs.tag == '' }}
            type=sha,enable=${{ needs.bump.outputs.tag == '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=release
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=release
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
