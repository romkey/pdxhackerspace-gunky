expire_items:
  cron: "0 6 * * *"
  class: ExpireItemsJob
  description: "Resolve items at 6:00 on each expiration calendar day (see app timezone in initializer)"

promote_lost_found_items:
  cron: "5 6 * * *"
  class: PromoteLostFoundItemsJob
  description: "Promote unclaimed or overdue claimed lost+found items to Gunky at 6:05 daily"
